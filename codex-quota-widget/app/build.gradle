plugins {
    id "com.android.application"
}

android {
    namespace "com.mirochill.codexquota"
    compileSdk 35

    def stableDebugKeystore = rootProject.file(".signing/debug.keystore")

    signingConfigs {
        if (stableDebugKeystore.exists()) {
            stableDebug {
                storeFile stableDebugKeystore
                storePassword "codex-widget-local"
                keyAlias "codexwidget"
                keyPassword "codex-widget-local"
            }
        }
    }

    defaultConfig {
        applicationId "com.mirochill.codexquota"
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName "1.13"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
            if (stableDebugKeystore.exists()) {
                signingConfig signingConfigs.stableDebug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
