plugins {
    id "com.android.application"
}

android {
    namespace "com.mirochill.codexquota"
    compileSdk 35

    defaultConfig {
        applicationId "com.mirochill.codexquota"
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName "1.6"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
