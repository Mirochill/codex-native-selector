name: Build Codex Quota APK

on:
  push:
    branches:
      - agent/codex-quota-auth-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex-quota-widget
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codex-quota-widget-debug
          path: codex-quota-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Store APK handoff on build branch
        if: github.event_name == 'push'
        run: |
          base64 -w 0 app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-debug.apk.b64
          git commit -m "Store compiled Codex widget APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
